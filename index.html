<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crush Depth - Sub Interior</title>
  <style>
    :root {
      --bg: #060d18;
      --panel: #0e1d2c;
      --line: #57f3b2;
      --line-2: #8ed6ff;
      --hud: #dff9ff;
      --muted: #9ad1c2;
      --gold: #f7d66d;
      --alert: #ff8f8f;
      --warning: #ffbd59;
      --dark: #08151f;
      --room: #1d3752;
      --room2: #18344a;
      --seat: #e6c180;
      --door: #d2eaf6;
      --player: #eaf7ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--hud);
      font-family: "Courier New", monospace;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #layout {
      width: min(1500px, 100%);
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    #gameWrap {
      flex: 1.3;
      min-width: 0;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 920px;
      height: auto;
      border: 3px solid var(--line);
      background: #050d17;
      image-rendering: pixelated;
    }

    #radarCanvas {
      margin-top: 12px;
      height: 180px;
      border-color: var(--line-2);
    }

    #sidePanel {
      flex: 0.85;
      min-width: 290px;
      background: var(--panel);
      border: 3px solid var(--line);
      padding: 14px;
      max-height: 900px;
      overflow: auto;
    }

    .section {
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 2px solid rgba(87, 243, 178, 0.6);
    }

    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--line);
      text-transform: uppercase;
    }

    .statRow {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      margin: 6px 0;
    }

    .label { color: var(--muted); }
    .value { color: var(--gold); }

    .screen {
      border: 2px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.02);
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 8px;
    }

    .screen strong {
      color: var(--line);
    }

    button {
      width: 100%;
      margin: 6px 0;
      background: var(--line);
      color: #04140d;
      border: none;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .controls {
      line-height: 1.6;
      font-size: 11px;
      color: var(--muted);
    }

    #stationButtons {
      display: grid;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div id="layout">
    <div id="gameWrap">
      <canvas id="gameCanvas" width="900" height="620"></canvas>
      <canvas id="radarCanvas" width="900" height="180"></canvas>
    </div>

    <aside id="sidePanel">
      <div class="section">
        <h2>Sub Status</h2>
        <div class="statRow"><span class="label">Depth</span><span class="value" id="depthStat">0m</span></div>
        <div class="statRow"><span class="label">Hull</span><span class="value" id="hullStat">100%</span></div>
        <div class="statRow"><span class="label">Fuel</span><span class="value" id="fuelStat">100%</span></div>
        <div class="statRow"><span class="label">Oxygen</span><span class="value" id="oxygenStat">100%</span></div>
        <div class="statRow"><span class="label">Power</span><span class="value" id="powerStat">100%</span></div>
      </div>

      <div class="section">
        <h2>Current Station</h2>
        <div class="screen" id="stationScreen">
          <strong>Helm</strong><br />
          Piloting deck, central command seat.
        </div>
        <div id="stationButtons"></div>
      </div>

      <div class="section">
        <h2>Log</h2>
        <div class="screen" id="logBox">Launch sequence complete.</div>
      </div>

      <div class="section">
        <h2>Controls</h2>
        <div class="controls">
          WASD / arrows: move<br />
          E: sit/activate station<br />
          Q: stand up / exit station<br />
          1-4: swap active station<br />
          SPACE: fire weapon<br />
          L: toggle lights
        </div>
      </div>
    </aside>
  </div>

  <script defer src="game.js"></script>
</body>
</html>
